name: CI

# The deployed application is the full-stack Next.js app in frontend/ (D-29). backend/ is the archived
# ASP.NET Core Phase 1 reference and is no longer built here.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: qrious_test
          POSTGRES_USER: qrious
          POSTGRES_PASSWORD: qrious_dev_password
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U qrious" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Unit + API integration tests (real PostgreSQL)
        run: npm test

  e2e:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: qrious_web
          POSTGRES_USER: qrious
          POSTGRES_PASSWORD: qrious_dev_password
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U qrious" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Migrate, build and start
        run: |
          cp .env.example .env.local
          cp .env.example .env
          npm run db:migrate
          npm run build
          nohup npm start > web.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000 >/dev/null && break; sleep 2; done
      - name: Playwright journeys (mobile + desktop)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            frontend/test-results
            frontend/web.log
