# Local development dependencies for QRious.
# Usage: docker compose -f infra/docker-compose.yml up -d
# Media files in local development are stored on disk by the API (Storage:Provider=local).
name: qrious
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: qrious
      POSTGRES_USER: qrious
      POSTGRES_PASSWORD: qrious_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qrious -d qrious"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
